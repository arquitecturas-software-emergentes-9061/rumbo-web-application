@if (restriction(); as current) {
  <section class="notice" role="alert" aria-labelledby="subscription-notice-title" [class.limit]="current.kind === 'PLAN_LIMIT'">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 9v4m0 4h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
    </svg>
    <div class="text">
      <strong id="subscription-notice-title">{{ title() }}</strong>
      <p>{{ detail() }}</p>
    </div>
    <button type="button" (click)="dismiss()" aria-label="Cerrar aviso del plan">Entendido</button>
  </section>
}
