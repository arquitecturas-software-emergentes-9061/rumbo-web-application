<aside class="sidebar">
  <a routerLink="/admin" class="brand" aria-label="Rumbo Admin, ir al panel">
    <img src="brand/rumbo-lockup.webp" alt="" width="143" height="50" />
    <span>Admin</span>
  </a>
  <nav aria-label="Administración" class="navigation">
    <a
      routerLink="/admin"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
      </svg>
      Panel
    </a>
    <a routerLink="/planning/sites" routerLinkActive="active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 21h18M5 21V7h7v14m0-10h7v10M8 10v1m0 3v1m0 3v1m8-5v1m0 3v1M7 7V4h3v3" />
      </svg>
      Clínicas y sedes
    </a>
    <a routerLink="/planning/maps" routerLinkActive="active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Zm6-3v15m6-12v15"/>
      </svg>
      Mapas
    </a>
    <a routerLink="/planning/map-editor" routerLinkActive="active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Zm9-13 4 4"/>
      </svg>
      Editor de mapa
    </a>
    <a routerLink="/planning/interfloor-connections" routerLinkActive="active" ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 19h5v-5h5V9h6M4 5h4m8 14h4M7 4l2 1-2 1m10 12-2 1 2 1"/>
      </svg>
      Conexiones entre pisos
    </a>
  </nav>
  <div class="sidebar-footer">
    <button type="button" (click)="signOut()" [disabled]="signingOut()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5H5v14h6m4-11 4 4-4 4m-5-4h9" />
      </svg>
      {{ signingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
    </button>
  </div>
</aside>
<div class="workspace">
  <header class="topbar">
    <strong>Rumbo Admin</strong>
    <div class="topbar-context">
      @if (context(); as site) {
        <span class="site-name">{{ site }}</span>
      }
      <span class="session">Sesión activa</span>
    </div>
  </header>
  <main class="page-content">
    <ng-content />
  </main>
</div>
